name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:   # permite lanzar manualmente desde Actions

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verificar que el tag coincide con la versión de pyproject.toml
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$TAG  pyproject=$PYPROJECT"
          if [ "$TAG" != "$PYPROJECT" ]; then
            echo "::error::El tag '$GITHUB_REF_NAME' apunta a un commit cuyo pyproject.toml declara '$PYPROJECT'."
            echo "::error::Sube 'version' en pyproject.toml ANTES de crear el tag, y vuelve a taguear."
            exit 1
          fi

      - name: Install build tool
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/DKOps
    permissions:
      id-token: write  # Trusted Publishing OIDC — no API token needed
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
