site_name: DKOps
site_description: Framework de gobierno Delta y orquestación de pipelines Spark para local y Databricks
site_author: Roberto Sánchez
site_url: https://brrsanchezfi.github.io/DKOps/
repo_url: https://github.com/brrsanchezfi/DKOps
repo_name: brrsanchezfi/DKOps
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Roberto Sánchez. Publicado bajo licencia MIT.

theme:
  name: material
  language: es
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/database-cog-outline
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - assets/stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/brrsanchezfi/DKOps
      name: Repositorio en GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/DKOps/
      name: Paquete en PyPI

plugins:
  - search:
      lang: es
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_category_heading: true
            members_order: source
            heading_level: 2
            show_if_no_docstring: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Inicio: index.md
  - Primeros pasos:
    - getting-started/index.md
    - Instalación: getting-started/installation.md
    - Configuración: getting-started/configuration.md
    - Tu primer pipeline: getting-started/first-pipeline.md
  - Conceptos:
    - concepts/index.md
    - Módulos: concepts/modules.md
    - Contratos: concepts/contracts.md
    - Flujos internos: concepts/flows.md
    - Local y Databricks: concepts/runtime.md
  - Ingesta:
    - ingestion/index.md
    - Carga batch: ingestion/batch.md
    - Carga streaming: ingestion/streaming.md
    - Promoción a Silver: ingestion/silver.md
    - Estrategias: ingestion/strategies.md
    - Columnas técnicas: ingestion/metadata.md
  - Gobierno de tablas:
    - governance/index.md
    - Propiedades y máscaras: governance/properties.md
    - Escritura: governance/writer.md
    - Metadata y tablas externas: governance/metadata.md
    - Lectura: governance/reader.md
    - Migraciones: governance/migrations.md
  - Operación:
    - operations/index.md
    - Logger de aplicación: operations/app-logger.md
    - Logs en la nube: operations/cloud-logs.md
    - Registro operativo: operations/ops-table.md
    - Consultas de monitoreo: operations/ops-queries.md
  - Demos:
    - demos/index.md
    - Aeronáutica: demos/demo_1.md
    - Manufactura: demos/demo_2.md
    - E-commerce: demos/demo_3.md
    - Retail e inventario: demos/demo_4.md
    - Marketplace: demos/demo_5.md
  - Referencia API:
    - api/index.md
    - Núcleo:
      - Launcher: api/launcher.md
      - EnvironmentConfig: api/environment_config.md
      - LoggerConfig: api/logger_config.md
    - Ingesta:
      - IngestionEngine: api/ingestion/engine.md
      - BronzeIngestor: api/ingestion/bronze_ingestor.md
      - SilverPromoter: api/ingestion/silver_promoter.md
      - Estrategias: api/ingestion/strategies.md
    - Contratos:
      - Loader: api/contracts/loader.md
      - Validator: api/contracts/validator.md
    - Writers:
      - TableWriter: api/writers/table_writer.md
      - BaseWriter: api/writers/base.md
      - CreateWriter: api/writers/create.md
      - AppendWriter: api/writers/append.md
      - UpsertWriter: api/writers/upsert.md
      - PartitionWriter: api/writers/partition.md
      - DeleteWriter: api/writers/delete.md
    - Readers:
      - TableReader: api/readers/table_reader.md
    - Migraciones:
      - SafeMigrator: api/migrations/safe_migrator.md
  - Changelog: changelog.md
